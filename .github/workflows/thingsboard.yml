name: ThingsBoard CI-CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx1024m
      SUREFIRE_JAVA_OPTS: -Xmx1200m -Xss256k -XX:+ExitOnOutOfMemoryError
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven


      - name: Build ThingsBoard
        run: mvn clean install -DskipTests

      - name: Upload ThingsBoard artifact
        uses: actions/upload-artifact@v4
        with:
          name: thingsboard-jar
          path: application/target/thingsboard-4.4.0-SNAPSHOT-boot.jar

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    env:
      MAVEN_OPTS: -Xmx1024m
      SUREFIRE_JAVA_OPTS: -Xmx1200m -Xss256k -XX:+ExitOnOutOfMemoryError
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: thingsboard-jar
          path: application/target

      - name: Data tests
        run: cd common; mvn -pl data test; cd ..

      - name: Proto tests
        run: cd common; mvn -pl proto -am test; cd ..

  exec:
    name: Run ThingsBoard
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: thingsboard-jar
          path: application/target

      - name: Initialize database
        run: |
          set -e
              
          ls -la $GITHUB_WORKSPACE/application/src/main/data
          ls -la $GITHUB_WORKSPACE/application/src/main/data/sql
              
          java -cp application/target/thingsboard-4.4.0-SNAPSHOT-boot.jar \
            -Dloader.main=org.thingsboard.server.ThingsboardInstallApplication \
            -Dinstall.data_dir=$GITHUB_WORKSPACE/application/src/main/data \
            -Dinstall.load_demo=true \
            -Dspring.jpa.hibernate.ddl-auto=none \
            -Dinstall.upgrade=false \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            org.springframework.boot.loader.launch.PropertiesLauncher

      - name: Start, verify and stop ThingsBoard
        run: |
          echo "Starting ThingsBoard..."
          java -jar application/target/thingsboard-4.4.0-SNAPSHOT-boot.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres &

          TB_PID=$!
          echo "PID: $TB_PID"

          echo "Waiting for startup..."
          sleep 60

          echo "Checking health..."
          if curl -f http://localhost:8080/actuator/health; then
            echo "ThingsBoard is healthy"
            SUCCESS=true
          else
            echo "Health check failed"
            SUCCESS=false
          fi

          echo "Stopping ThingsBoard..."
          kill $TB_PID

          if [ "$SUCCESS" = true ]; then
            exit 0
          else
            exit 1
          fi
