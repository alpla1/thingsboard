name: ThingsBoard CI-CD

on:
  push:
    branches: [master]

  pull_request:

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx1024m
      SUREFIRE_JAVA_OPTS: -Xmx1200m -Xss256k -XX:+ExitOnOutOfMemoryError
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Build ThingsBoard
        run: mvn clean package -DskipTests

      - name: data tests
        run: cd common; mvn -pl data test

      - name: proto tests
        run: mvn -pl proto test; cd ..
